    <text x="90" y="300" font-size="76" font-weight="800" fill="#f0f6fc">for Coding Interviews</text>
    <text x="90" y="375" font-size="34" fill="#8b949e">9 runnable machine-coding solutions &#183; SOLID &#183; Design Patterns</text>
    <text x="90" y="425" font-size="34" fill="#8b949e">Parking Lot &#183; Splitwise &#183; BookMyShow &#183; Elevator &#183; Java</text>
