<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect y="0" width="1280" height="10" fill="url(#accent)"/>
  <rect y="630" width="1280" height="10" fill="url(#accent)"/>
  <!-- faint class-diagram motif -->
  <g stroke="#30363d" stroke-width="3" fill="none">
    <rect x="920" y="120" width="260" height="150" rx="12"/>
    <line x1="920" y1="175" x2="1180" y2="175"/>
    <rect x="980" y="380" width="260" height="150" rx="12"/>
    <line x1="980" y1="435" x2="1240" y2="435"/>
